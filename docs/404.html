<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages paths are case-sensitive and Windows can't hold both
    // DoodleWizards/ and doodlewizards/, so fix the case here instead.
    if (/^\/doodlewizards(\/|$)/i.test(location.pathname)) {
      location.replace("/DoodleWizards/" + location.search + location.hash);
    }
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">

</head>
