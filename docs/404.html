<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages paths are case-sensitive and Windows can't hold both
    // DoodleWizards/ and doodlewizards/, so fix the case here instead.
    // Also fix the case of the press and language folders (zh_cn -> zh_CN),
    // and only redirect when something changed, so a missing page can't loop.
    (function () {
      var p = location.pathname;
      if (!/^\/doodlewizards(\/|$)/i.test(p)) return;
      var dirs = { "press": "press", "zh_cn": "zh_CN", "zh-cn": "zh_CN", "zh-hans": "zh_CN",
        "zh_tw": "zh_TW", "zh-tw": "zh_TW", "zh-hant": "zh_TW", "pt_br": "pt_BR", "pt-br": "pt_BR",
        "ru": "ru", "es": "es", "de": "de", "fr": "fr", "tr": "tr", "pl": "pl", "ko": "ko", "ja": "ja", "it": "it" };
      var parts = p.split("/");
      parts[1] = "DoodleWizards";
      for (var i = 2; i < parts.length && i < 4; i++) {
        var k = parts[i].toLowerCase();
        if (dirs.hasOwnProperty(k)) parts[i] = dirs[k];
      }
      var fixed = parts.join("/");
      if (fixed !== p) location.replace(fixed + location.search + location.hash);
    })();
  </script>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main>
    <h1>This page got erased.</h1>
    <p>Nothing is drawn here yet.</p>
    <a class="card" href="/DoodleWizards/">
      <img src="/assets/avatar.jpg" width="96" height="96" alt="">
      <span>
        <strong>Doodle Wizards</strong>
        Go to the game page.
      </span>
    </a>
  </main>
</body>
</html>
